name: Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types:
      - opened
      - reopened
      - edited

jobs:
  lint-commits:
    name: Ensure Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webiny/action-conventional-commits@v1.3.0

  # pr-labeler:
  #   name: PR Labeler
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: TimonVS/pr-labeler-action@v3
  #       with:
  #         configuration-path: .github/pr-labeler.yml # optional, .github/pr-labeler.yml is the default value
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  aot-smoke:
    # No JIT, no Reflection.Emit, no runtime generic instantiation over value types: stricter than Unity IL2CPP,
    # so a pass is the CI proxy for "runs under IL2CPP".
    name: NativeAOT smoke (IL2CPP proxy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish NativeAOT
      run: dotnet publish tests/RoguelikeToolkit.Entities.AotSmoke -c Release -r linux-x64 -o aot-smoke
    - name: Run
      run: ./aot-smoke/RoguelikeToolkit.Entities.AotSmoke
