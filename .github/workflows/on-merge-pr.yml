name: Publish & Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Merged-PR events all resolve github.ref to the base branch, so every merge shares this group. Queue instead of
# cancelling: a cancelled run leaves its version to be tagged by the next run, which may then fail (v6.0.0 was lost so).
concurrency:
  group: ${{ github.ref }}-publish-release
  cancel-in-progress: false

jobs:
  build-and-pack:
    name: Build & Test
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET tooling
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: '5.x'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7
        with:
          useConfigFile: true
          configFilePath: ./.github/gitversion.yml
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release /p:CI=true /p:Version=${{ steps.gitversion.outputs.AssemblySemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} --no-restore /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"
      - name: Test
        run: dotnet test --configuration Release /p:Version=${{ steps.gitversion.outputs.AssemblySemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} --no-build --verbosity normal
      # Tags are plain semver (v5.1.0): UPM/OpenUPM reject 4-part versions. Assemblies keep AssemblySemVer.
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: v${{ steps.gitversion.outputs.MajorMinorPatch }}
    outputs:
      tag: v${{ steps.gitversion.outputs.MajorMinorPatch }}
      version: ${{ steps.gitversion.outputs.MajorMinorPatch }}

  changelog-release:
    name: Update Changelog & Release
    runs-on: ubuntu-latest
    needs: [build-and-pack]
    steps:
      # Check out the base branch: on pull_request events the default checkout is the PR merge ref, and the
      # auto-commit below would push CHANGELOG.md to the (already merged) PR head branch instead of main.
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Update CHANGELOG
        id: changelog
        uses: Requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{needs.build-and-pack.outputs.tag}}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          name: ${{needs.build-and-pack.outputs.tag}}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
          tag: ${{needs.build-and-pack.outputs.tag}}
      # The action defaults `branch` to github.head_ref: the merged, often already deleted, PR branch. Pin it to the
      # base branch. Non-blocking: main is protected, and a rejected docs push must not skip NuGet/UPM publishing.
      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v4
        continue-on-error: true
        with:
          branch: ${{ github.event.pull_request.base.ref }}
          commit_message: 'docs: update CHANGELOG.md for ${{needs.build-and-pack.outputs.tag}}'
          file_pattern: CHANGELOG.md
    outputs:
      tag: ${{ needs.build-and-pack.outputs.tag }}
      version: ${{ needs.build-and-pack.outputs.version }}

  publish-nuget:
    name: Publish (NuGet)
    runs-on: ubuntu-latest
    needs: [changelog-release]
    steps:
      - name: Setup .NET tooling
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Pack NuGet
        run: dotnet pack --configuration release /p:CI=true -o:package /p:AssemblyVersion=${{needs.changelog-release.outputs.version}} /p:Version=${{needs.changelog-release.outputs.version}} /p:PackageVersion=${{needs.changelog-release.outputs.version}}
      - name: Publish to NuGet
        run: dotnet nuget push ./package/*.nupkg  -s https://api.nuget.org/v3/index.json  -k ${{ secrets.NUGET_TOKEN }}

  publish-upm:
    # Binary UPM packages (netstandard2.1 DLL + metas + link.xml hook) attached to the GitHub Release; OpenUPM tracks
    # release assets named com.rogueliketoolkit.entities-*.tgz and com.rogueliketoolkit.entities.scripting.jint-*.tgz
    # (neither glob matches the other). The plugins zip is the no-registry fallback (whole DLL closure for
    # Assets/Plugins). Asset names must not share a tarball prefix.
    name: Publish (UPM)
    runs-on: ubuntu-latest
    needs: [changelog-release]
    permissions:
      contents: write
    steps:
      - name: Setup .NET tooling
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog-release.outputs.tag }}
      - name: Pack UPM tarballs
        run: |
          python3 tools/upm/pack.py package \
            --package upm/com.rogueliketoolkit.entities \
            --version ${{ needs.changelog-release.outputs.version }} \
            --project src/RoguelikeToolkit.Entities/RoguelikeToolkit.Entities.csproj \
            --out upm-dist
          python3 tools/upm/pack.py package \
            --package upm/com.rogueliketoolkit.entities.scripting.jint \
            --version ${{ needs.changelog-release.outputs.version }} \
            --project src/RoguelikeToolkit.Entities.Scripting.Jint/RoguelikeToolkit.Entities.Scripting.Jint.csproj \
            --sync-dependency com.rogueliketoolkit.entities \
            --out upm-dist
      - name: Pack plugins zip
        run: >
          python3 tools/upm/pack.py plugins
          --version ${{ needs.changelog-release.outputs.version }}
          --project src/RoguelikeToolkit.Entities/RoguelikeToolkit.Entities.csproj
          --project src/RoguelikeToolkit.Entities.Scripting.Jint/RoguelikeToolkit.Entities.Scripting.Jint.csproj
          --link-xml upm/com.rogueliketoolkit.entities/Runtime/link.xml
          --link-xml upm/com.rogueliketoolkit.entities.scripting.jint/Runtime/link.xml
          --out upm-dist/RoguelikeToolkit.Entities-${{ needs.changelog-release.outputs.version }}-unity-plugins.zip
      - name: Attach to release
        run: gh release upload "${{ needs.changelog-release.outputs.tag }}" upm-dist/*.tgz upm-dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
